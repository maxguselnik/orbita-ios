name: Orbita
options:
  bundleIdPrefix: com.maxguselnik
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  OrbitPhysics:
    path: Packages/OrbitPhysics
targets:
  Orbita:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: OrbitPhysics
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Орбита
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Разрешает 120 Гц (ProMotion) на iPhone.
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxguselnik.orbita
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Team ID из переменной окружения, чтобы xcodegen generate не сбрасывал выбор.
        DEVELOPMENT_TEAM: ${ORBITA_TEAM}
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_USER_SCRIPT_SANDBOXING: YES
