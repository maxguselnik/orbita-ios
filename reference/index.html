<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Орбита">
<meta name="theme-color" content="#070b16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=IBM+Plex+Sans+Condensed:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<title>Орбита</title>
<style>
:root{
  --ink:#070b16; --panel:rgba(10,16,32,.74); --panel2:rgba(22,32,58,.92); --line:rgba(120,160,230,.22);
  --text:#e6edf8; --muted:#8ea2c2; --amber:#ffb347; --cyan:#6fd3ff; --violet:#b69cff; --green:#5ee08a; --red:#ff6b6b;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#070b16; --panel:rgba(10,16,32,.74); --text:#e6edf8; } }
:root[data-theme="dark"]{ --ink:#070b16; --panel:rgba(10,16,32,.74); --text:#e6edf8; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{height:100%;margin:0;background:var(--ink);color:var(--text);overflow:hidden;
  font-family:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;font-size:13px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
.num{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
#cv{position:fixed;left:0;top:0;display:block}
.hidden{display:none!important}
.screen{position:fixed;inset:0;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.b{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13px;
  padding:6px 10px;min-height:38px;touch-action:manipulation;cursor:pointer}
.b:active,.b.down{background:#2c4170}
.b:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.b.on{background:var(--cyan);color:#05121c;border-color:var(--cyan)}
.b.amber{background:var(--amber);color:#2a1500;border-color:var(--amber);font-weight:600}
/* menu */
#menu{display:flex;align-items:center;justify-content:space-between;gap:24px}
#menu h1{font-family:'Russo One',system-ui,sans-serif;font-weight:400;font-size:clamp(44px,9vw,92px);margin:0;letter-spacing:.02em;line-height:.9}
#menu .sub{color:var(--muted);margin:10px 0 0;font-size:15px;max-width:30ch}
#menuBtns{display:flex;flex-direction:column;gap:8px;min-width:230px}
#menuBtns .b{min-height:44px;font-size:15px;text-align:left}
#goalsMini{color:var(--muted);font-size:12px;margin-top:4px}
/* VAB */
#vab{display:grid;grid-template-columns:200px 1fr 230px;gap:10px}
#palette{overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:4px;padding-right:2px}
.pi{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 6px;min-height:46px;cursor:pointer}
.pi:active{background:#22355c}
.pi canvas{width:34px;height:40px;flex:none}
.pi b{font-weight:600;display:block;font-size:12.5px}
.pi small{color:var(--muted);font-size:11px}
#vabCenter{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 100%,#1a2440 0%,#0b1124 60%,#070b16 100%)}
#vabCv{flex:1;width:100%;min-height:0;display:block}
#vabTools{display:flex;gap:6px;padding:6px;border-top:1px solid var(--line)}
#vabTools .b{flex:1;min-height:36px}
#vabSide{display:flex;flex-direction:column;gap:6px;overflow-y:auto;touch-action:pan-y}
#vabSide .row{display:flex;gap:6px}
#vabSide .row .b{flex:1}
#stats{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;line-height:1.45}
#stats .w{color:var(--red)}
#stats .hint{color:var(--muted);font-size:11px;margin-top:4px}
#btnLaunch{min-height:52px;font-size:17px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;
  padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
#hudIn{position:relative;width:100%;height:100%}
#hud .b,#hud .pin{pointer-events:auto}
.pan{background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#ti{position:absolute;top:0;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(4,auto);gap:2px 14px;padding:5px 12px;white-space:nowrap}
#ti .k{color:var(--muted);font-size:11px;margin-right:5px}
#ti .v{font-size:13.5px}
#ti .ap{color:var(--cyan)}
#ti .st{grid-column:1/-1;text-align:center;color:var(--muted);font-size:11.5px}
#warpBox{position:absolute;top:0;left:0;display:flex;align-items:center;gap:4px;padding:3px}
#warpBox .b{min-height:34px;min-width:38px;padding:4px 8px}
#warpLbl{min-width:58px;text-align:center}
#mt{position:absolute;top:44px;left:2px;color:var(--muted);font-size:11.5px}
#tr{position:absolute;top:0;right:0;display:flex;gap:6px}
#tr .b{min-height:36px}
#sInfo{position:absolute;right:0;top:44px;width:154px;padding:6px 8px;font-size:11.5px;line-height:1.4}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin:3px 0 4px}
.bar i{display:block;height:100%;background:var(--amber);width:0}
#thr{position:absolute;left:0;top:64px;bottom:0;width:52px;display:flex;flex-direction:column;gap:4px}
#thr .b{min-height:32px;padding:2px;font-size:12px}
#thrTrack{flex:1;position:relative;border-radius:10px;background:var(--panel);border:1px solid var(--line);overflow:hidden;pointer-events:auto;touch-action:none}
#thrFill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,#ff8a2b,#ffd27a);height:0}
#thrLbl{position:absolute;left:0;right:0;top:4px;text-align:center;font-size:12px;mix-blend-mode:difference}
#rot{position:absolute;left:60px;bottom:0;display:flex;gap:6px}
#rot .b{width:62px;height:58px;font-size:24px;padding:0}
#nb{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:108px;height:108px;pointer-events:none}
#nbTxt{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
#sas{position:absolute;right:0;bottom:70px;display:grid;grid-template-columns:repeat(3,48px);gap:4px}
#sas .b{min-height:32px;padding:2px;font-size:11.5px}
#stageBtn{position:absolute;right:0;bottom:0;width:154px;height:62px;font-size:16px;line-height:1.1}
#stageBtn small{display:block;font-size:11px;font-weight:400;opacity:.75}
#mapInfo{position:absolute;left:60px;top:64px;max-width:250px;padding:6px 9px;font-size:11.5px;line-height:1.45}
#mapInfo .enc{color:var(--violet)} #mapInfo .ret{color:var(--amber)}
#toasts{position:fixed;top:calc(max(6px,env(safe-area-inset-top)) + 62px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none;z-index:30}
.toast{background:var(--panel2);border:1px solid var(--line);padding:5px 12px;border-radius:20px;font-size:12.5px;animation:tIn .25s ease-out}
.toast.gold{border-color:var(--amber);color:var(--amber)}
@keyframes tIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#ov{position:fixed;inset:0;z-index:40;background:rgba(3,6,14,.72);display:flex;align-items:center;justify-content:center;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#ovBox{max-width:600px;width:100%;max-height:100%;overflow-y:auto;touch-action:pan-y;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
#ovBox h2{font-family:'Russo One',system-ui,sans-serif;font-weight:400;margin:0 0 8px;font-size:22px}
#ovBox p,#ovBox li{line-height:1.45;color:#cdd8ea}
#ovBox ol{padding-left:20px;margin:6px 0}
#ovBtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#ovBtns .b{flex:1 1 140px;min-height:44px}
.goal{display:flex;gap:8px;padding:2px 0;color:var(--muted)} .goal.ok{color:var(--green)}
#rotateMsg{position:fixed;inset:0;z-index:100;background:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;padding:30px}
@media (prefers-reduced-motion: reduce){.toast{animation:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="menu" class="screen">
  <div>
    <h1>Орбита</h1>
    <p class="sub">Собери ракету, выйди на орбиту Терры, долети до Луны, сядь и вернись домой.</p>
  </div>
  <div id="menuBtns">
    <button class="b amber" id="mVab">Собрать ракету</button>
    <button class="b" id="mCont">Продолжить сохранённый полёт</button>
    <button class="b" id="mHelp">Как играть</button>
    <button class="b" id="mSound">Звук включён</button>
    <div id="goalsMini"></div>
  </div>
</div>

<div id="vab" class="screen hidden">
  <div id="palette"></div>
  <div id="vabCenter">
    <canvas id="vabCv"></canvas>
    <div id="vabTools">
      <button class="b" id="vUp" aria-label="Поднять деталь">▲</button>
      <button class="b" id="vDn" aria-label="Опустить деталь">▼</button>
      <button class="b" id="vDel">Удалить</button>
      <button class="b" id="vClr">Очистить</button>
    </div>
  </div>
  <div id="vabSide">
    <div class="row"><button class="b" data-pre="sub">Прыжок</button><button class="b" data-pre="orb">Орбита</button><button class="b" data-pre="mun">Луна</button></div>
    <div id="stats"></div>
    <button class="b amber" id="btnLaunch">На старт</button>
    <button class="b" id="vBack">В меню</button>
  </div>
</div>

<div id="hud" class="hidden"><div id="hudIn">
  <div id="warpBox" class="pan">
    <button class="b" id="wDn" aria-label="Медленнее">◀</button>
    <span id="warpLbl" class="num">×1</span>
    <button class="b" id="wUp" aria-label="Быстрее">▶</button>
  </div>
  <div id="mt" class="num">T+ 00:00</div>
  <div id="ti" class="pan">
    <div><span class="k">Выс</span><span class="v num" id="hAlt">0</span></div>
    <div><span class="k">Скор</span><span class="v num" id="hSpd">0</span></div>
    <div class="ap"><span class="k">Ап</span><span class="v num" id="hAp">—</span></div>
    <div class="ap"><span class="k">Пе</span><span class="v num" id="hPe">—</span></div>
    <div><span class="k">Верт</span><span class="v num" id="hVs">0</span></div>
    <div><span class="k">Над грунтом</span><span class="v num" id="hRad">0</span></div>
    <div class="ap"><span class="k">До Ап</span><span class="v num" id="hTap">—</span></div>
    <div class="ap"><span class="k">До Пе</span><span class="v num" id="hTpe">—</span></div>
    <div class="st" id="hSt">Терра · на поверхности</div>
  </div>
  <div id="tr">
    <button class="b" id="bMap">Карта</button>
    <button class="b" id="bFocus">Фокус</button>
    <button class="b" id="bPause" aria-label="Пауза">❚❚</button>
  </div>
  <div id="sInfo" class="pan">
    <div>Топливо ступени</div>
    <div class="bar"><i id="fuelBar"></i></div>
    <div class="num" id="sDv">Δv 0 м/с</div>
    <div class="num" id="sTot">всего 0 м/с</div>
    <div class="num" id="sTwr">TWR 0</div>
  </div>
  <div id="mapInfo" class="pan hidden"></div>
  <div id="thr">
    <button class="b" id="tMax">MAX</button>
    <div id="thrTrack"><div id="thrFill"></div><div id="thrLbl" class="num">0%</div></div>
    <button class="b" id="tCut">0</button>
  </div>
  <div id="rot">
    <button class="b" id="rL" aria-label="Повернуть влево">⟲</button>
    <button class="b" id="rR" aria-label="Повернуть вправо">⟳</button>
  </div>
  <div id="nbTxt" class="num"></div>
  <canvas id="nb"></canvas>
  <div id="sas">
    <button class="b on" id="sasT">SAS</button>
    <button class="b" data-m="pro">Прогр</button>
    <button class="b" data-m="retro">Ретро</button>
    <button class="b on" data-m="hold">Держ</button>
    <button class="b" data-m="rout">Рад↑</button>
    <button class="b" data-m="rin">Рад↓</button>

  <button class="b amber" id="stageBtn">Зажигание<small>ступень</small></button>
</div></div>

<div id="toasts"></div>
<div id="ov" class="hidden"><div id="ovBox"><div id="ovBody"></div><div id="ovBtns"></div></div></div>
<div id="rotateMsg" class="hidden">Поверните телефон горизонтально</div>

<script>
(() => {
'use strict';
// ================= utils
const TAU = Math.PI * 2, G0 = 9.80665;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const len = v => Math.hypot(v[0], v[1]);
const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const wrapPi = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const wrap2 = a => { a %= TAU; return a < 0 ? a + TAU : a; };
const lerp = (a, b, t) => a + (b - a) * t;
const $ = id => document.getElementById(id);
const grp = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u2009');
function fmtD(m) {
  if (!isFinite(m)) return '∞';
  const a = Math.abs(m), s = m < 0 ? '−' : '';
  if (a < 10000) return s + grp(a) + ' м';
  if (a < 1e5) return s + (a / 1000).toFixed(2) + ' км';
  if (a < 1e6) return s + (a / 1000).toFixed(1) + ' км';
  return s + grp(a / 1000) + ' км';
}
function fmtV(v) { return (v < 0 ? '−' : '') + (Math.abs(v) < 100 ? Math.abs(v).toFixed(1) : grp(Math.abs(v))) + ' м/с'; }
function fmtT(s) {
  if (!isFinite(s)) return '—';
  s = Math.max(0, s); const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), c = Math.floor(s % 60), p = n => String(n).padStart(2, '0');
  return (d ? d + 'д ' : '') + (h || d ? p(h) + ':' : '') + p(m) + ':' + p(c);
}
function lerpCol(a, b, t) {
  const pa = [1, 3, 5].map(i => parseInt(a.substr(i, 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.substr(i, 2), 16));
  return 'rgb(' + pa.map((x, i) => Math.round(lerp(x, pb[i], t))).join(',') + ')';
}
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};

// ================= world
const TERRA = { id: 'terra', name: 'Терра', R: 600000, mu: 3.5316e12, atm: 70000, rho0: 1.225, Hs: 5600, soi: Infinity,
  c1: '#4f9a5c', c2: '#2d6a3e', sea: '#2a5d9e' };
const LUNA = { id: 'luna', name: 'Луна', R: 200000, mu: 6.5138398e10, atm: 0, soi: 2429559, orbitR: 12000000,
  c1: '#a9a7a1', c2: '#77756f' };
LUNA.omega = Math.sqrt(TERRA.mu / LUNA.orbitR ** 3);
LUNA.phi0 = 2.6;
const BODY = { terra: TERRA, luna: LUNA };
// Луна идёт по часовой стрелке — туда же, куда разворачивается ракета (наклон вправо)
function lunaPos(t) { const a = LUNA.phi0 - LUNA.omega * t; return [LUNA.orbitR * Math.cos(a), LUNA.orbitR * Math.sin(a)]; }
function lunaVel(t) { const a = LUNA.phi0 - LUNA.omega * t, s = LUNA.orbitR * LUNA.omega; return [s * Math.sin(a), -s * Math.cos(a)]; }
const PAD_ANG = Math.PI / 2;
function terraBase(a) { return 1500 + 800 * Math.sin(3 * a + 1) + 400 * Math.sin(7 * a + 2) + 200 * Math.sin(23 * a + .5) + 60 * Math.sin(97 * a + 1.3) + 20 * Math.sin(311 * a + .7); }
const PAD_H = terraBase(PAD_ANG);
function terrainH(b, a) {
  if (b === TERRA) { const d = wrapPi(a - PAD_ANG), w = Math.exp(-((d / 0.01) ** 2)); return terraBase(a) * (1 - w) + PAD_H * w; }
  return 1700 + 900 * Math.sin(5 * a) + 500 * Math.sin(13 * a + 1) + 250 * Math.sin(41 * a + 2) + 90 * Math.sin(131 * a + .4) + 30 * Math.sin(419 * a + 2.2);
}
function density(b, alt) { return b.atm && alt < b.atm ? b.rho0 * Math.exp(-Math.max(0, alt) / b.Hs) : 0; }

// ================= orbital mechanics (universal variables, works for ellipse & hyperbola)
function stC(z) { if (z > 1e-6) { const s = Math.sqrt(z); return (1 - Math.cos(s)) / z; } if (z < -1e-6) { const s = Math.sqrt(-z); return (Math.cosh(s) - 1) / (-z); } return 0.5 - z / 24; }
function stS(z) { if (z > 1e-6) { const s = Math.sqrt(z); return (s - Math.sin(s)) / (s * s * s); } if (z < -1e-6) { const s = Math.sqrt(-z); return (Math.sinh(s) - s) / (s * s * s); } return 1 / 6 - z / 120; }
function numProp(r0, v0, mu, dt) {
  let r = r0.slice(), v = v0.slice(); const n = clamp(Math.ceil(Math.abs(dt) / 2), 200, 40000), h = dt / n;
  const acc = p => { const m = len(p), k = -mu / (m * m * m); return [p[0] * k, p[1] * k]; };
  let a = acc(r);
  for (let i = 0; i < n; i++) {
    v[0] += a[0] * h / 2; v[1] += a[1] * h / 2; r[0] += v[0] * h; r[1] += v[1] * h;
    a = acc(r); v[0] += a[0] * h / 2; v[1] += a[1] * h / 2;
  }
  return [r, v];
}
function kepler(r0, v0, mu, dt) {
  if (dt === 0) return [r0.slice(), v0.slice()];
  const r0m = len(r0), v02 = dot(v0, v0), sm = Math.sqrt(mu), rv = dot(r0, v0), vr0 = rv / r0m, alpha = 2 / r0m - v02 / mu;
  if (alpha > 1e-12) { const P = TAU / (sm * alpha ** 1.5); dt = dt % P; }
  let x;
  if (alpha > 1e-12) x = sm * alpha * dt;
  else if (alpha < -1e-12) {
    const a = 1 / alpha, arg = (-2 * mu * alpha * dt) / (rv + Math.sign(dt) * Math.sqrt(-mu * a) * (1 - r0m * alpha));
    x = arg > 0 ? Math.sign(dt) * Math.sqrt(-a) * Math.log(arg) : sm * Math.abs(alpha) * dt;
    if (!isFinite(x)) x = sm * Math.abs(alpha) * dt;
  } else x = sm * dt / r0m;
  let ok = false;
  for (let i = 0; i < 60; i++) {
    const x2 = x * x, z = alpha * x2, C = stC(z), S = stS(z);
    const F = r0m * vr0 / sm * x2 * C + (1 - alpha * r0m) * x2 * x * S + r0m * x - sm * dt;
    const dF = r0m * vr0 / sm * x * (1 - z * S) + (1 - alpha * r0m) * x2 * C + r0m;
    const ratio = F / dF; x -= ratio;
    if (!isFinite(x)) break;
    if (Math.abs(ratio) < 1e-10 * Math.max(1, Math.abs(x))) { ok = true; break; }
  }
  if (!ok || !isFinite(x)) return numProp(r0, v0, mu, dt);

  holdBtn($('rR'), () => input.rot = -1, () => input.rot = 0);
  $('stageBtn').onclick = () => stage();
  $('sasT').onclick = () => { S.sas = !S.sas; S.hold = S.th; Sfx.click(); };
  document.querySelectorAll('#sas [data-m]').forEach(b => b.onclick = () => { S.sas = true; S.sasMode = b.dataset.m; S.hold = S.th; Sfx.click(); });

  $('bFocus').onclick = () => { const order = ['terra', 'luna', 'ship']; const cur = mapFocus || S.soi; mapFocus = order[(order.indexOf(cur) + 1) % 3]; mapPan = [0, 0]; fitMap(); toast('Фокус: ' + ({ terra: 'Терра', luna: 'Луна', ship: 'корабль' })[mapFocus]); };

}
